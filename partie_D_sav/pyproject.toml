    { name = "Hajar El Alaoui", email = "elalaouihajar60@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "mcp[cli]<2",
